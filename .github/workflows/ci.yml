name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests
        working-directory: mailmanager
        run: npm test
      - name: Syntax checks
        working-directory: mailmanager
        run: |
          node --check background/background.js
          node --check tab/tab.js
          node --check shared/utils.js
          node --check tab/tab-utilities.js
      - name: Build and validate XPI
        working-directory: mailmanager
        run: |
          npm run build
          unzip -t ../mailmanager.xpi

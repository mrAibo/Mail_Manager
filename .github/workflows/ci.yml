name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check
        working-directory: mailmanager
        run: npm run check
      - name: Release validation
        working-directory: mailmanager
        run: node scripts/check-release.mjs
      - name: i18n validation
        working-directory: mailmanager
        run: node scripts/check-i18n.mjs
      - name: Build and validate XPI
        working-directory: mailmanager
        run: |
          npm run build
          unzip -t ../mailmanager.xpi
      - name: Upload XPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: mailmanager.xpi
          path: mailmanager.xpi

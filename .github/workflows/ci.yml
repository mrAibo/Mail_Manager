name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check
        working-directory: mailmanager
        run: npm run check
      - name: i18n key audit
        working-directory: mailmanager
        run: |
          echo "=== Collecting __MSG_ keys from HTML ==="
          grep -oP '__MSG_\\K[A-Za-z0-9_]+(?=__)' tab/tab.html | sort -u > /tmp/html-keys.txt
          echo "=== Checking de/en/ru coverage ==="
          ok=1
          for lang in de en ru; do
            while read key; do
              if ! grep -q \"\\\"$key\\\"\" _locales/$lang/messages.json; then
                echo "MISSING: $lang/$key"
                ok=0
              fi
            done < /tmp/html-keys.txt
            if [ "$ok" = 1 ]; then echo "$lang: all keys present"; fi
          done
          if [ "$ok" = 0 ]; then echo "i18n check FAILED"; exit 1; fi
          echo "=== Safety: messages.delete without permission ==="
          if grep -q 'messages\.delete' background/background.js; then
            if ! grep -q 'messagesDelete' manifest.json; then
              echo "ERROR: messages.delete() used but messagesDelete permission missing"
              exit 1
            fi
          fi
          echo "Safety checks passed"
      - name: Build and validate XPI
        working-directory: mailmanager
        run: |
          npm run build
          unzip -t ../mailmanager.xpi
      - name: Upload XPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: mailmanager.xpi
          path: mailmanager.xpi
